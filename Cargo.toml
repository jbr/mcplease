[workspace]
members = [".", "cli"]
resolver = "2"

[package]
name = "mcplease"
version = "0.3.0"
edition = "2024"
description = "simple mcp framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jbr/mcplease"
readme = "README.md"
exclude = ["spec"]
keywords = ["mcp"]
categories = ["development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
env_logger = "0.11.11"
fieldwork = "0.5.3"
log = "0.4.33"
notify = "8.2.0"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shellexpand = "3.1.2"
